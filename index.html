<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Baliston Health — Content &amp; Marketing Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F2F3;
  --surface:#FFFFFF;
  --surface-2:#F8F9F9;
  --ink:#101416;
  --ink-2:#3E4649;
  --muted:#767F83;
  --faint:#9AA3A7;
  --line:#E2E5E6;
  --line-soft:#EDEFF0;
  --accent:#0F4C4A;
  --accent-soft:#E7EFEE;
  --warn:#A8641B;
  --alert:#9E3A2C;
  --ok:#2E6B4F;
  --info:#2E6F9E;
  --block:#63549C;

  --ws-content:#1F5E63;
  --ws-funnel:#414781;
  --ws-video:#7A4560;
  --ws-kol:#55693C;
  --ws-stories:#A2682F;
  --ws-design:#3F566B;

  --r:3px;
  --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--accent);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:500;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* ---------- shell ---------- */
.shell{max-width:1440px;margin:0 auto;padding:0 28px 80px;}
header.top{
  position:sticky;top:0;z-index:40;background:rgba(241,242,243,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.top-inner{max-width:1440px;margin:0 auto;padding:16px 28px 0;}
.brandrow{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between;}
.brand{display:flex;align-items:baseline;gap:12px;}
.brand h1{
  font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:-.01em;margin:0;
}
.brand .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.topctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.savechip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);white-space:nowrap;}
.savechip.on{color:var(--ok);}

.tabs{display:flex;gap:2px;margin-top:14px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);
  font-size:13px;font-weight:500;white-space:nowrap;letter-spacing:-.005em;
}
.tab:hover{color:var(--ink-2);}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);}
.tab .cnt{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:6px;}

/* ---------- generic ---------- */
.viewhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:30px 0 16px;}
.viewhead h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:2px 0 0;letter-spacing:-.015em;}
.viewhead p{margin:5px 0 0;color:var(--muted);max-width:60ch;font-size:13px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
.pad{padding:18px 20px;}

.btn{
  border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);
  font-size:12.5px;font-weight:500;color:var(--ink-2);transition:border-color .12s,background .12s;
}
.btn:hover{border-color:var(--ink-2);color:var(--ink);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:#0b3d3b;}
.btn.ghost{border-color:transparent;color:var(--muted);}
.btn.ghost:hover{border-color:var(--line);color:var(--ink);}
.btn.danger:hover{border-color:var(--alert);color:var(--alert);}
.btn.sm{padding:4px 9px;font-size:11.5px;}

select.bare,input.bare{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:6px 10px;font-size:12.5px;
}

/* ---------- meter (signature) ---------- */
.meter{margin-top:14px;}
.meter-track{position:relative;height:34px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;overflow:hidden;}
.meter-segs{position:absolute;inset:0;display:flex;}
.meter-seg{height:100%;opacity:.9;}
.meter-over{
  position:absolute;top:0;bottom:0;
  background:repeating-linear-gradient(135deg,rgba(158,58,44,.75),rgba(158,58,44,.75) 3px,rgba(158,58,44,.35) 3px,rgba(158,58,44,.35) 7px);
}
.meter-ticks{position:absolute;inset:0;pointer-events:none;}
.meter-tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.5);}
.meter-tick.major{background:rgba(255,255,255,.85);}
.meter-tick.empty{background:var(--line);}
.meter-cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);}
.meter-scale{display:flex;justify-content:space-between;margin-top:5px;}
.meter-scale span{font-family:var(--mono);font-size:9.5px;color:var(--faint);}
.meter-read{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;}
.meter-read .big{font-family:var(--serif);font-size:42px;line-height:1;font-weight:300;letter-spacing:-.02em;}
.meter-read .of{font-family:var(--mono);font-size:12px;color:var(--muted);}
.meter-read .flag{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;
}
.flag.over{background:#fbecea;color:var(--alert);}
.flag.under{background:#fdf4e8;color:var(--warn);}
.flag.good{background:var(--accent-soft);color:var(--accent);}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:1.25fr .9fr;gap:14px;align-items:start;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line-soft);margin-top:18px;}
.stat{padding:14px 0 4px;border-right:1px solid var(--line-soft);}
.stat:last-child{border-right:none;}
.stat .v{font-family:var(--serif);font-size:27px;font-weight:400;line-height:1;}
.stat .l{margin-top:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}

.wsbar{display:grid;grid-template-columns:1fr;gap:11px;}
.wsrow{display:grid;grid-template-columns:1fr 76px;gap:12px;align-items:center;}
.wsname{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.wstrack{height:4px;background:var(--line-soft);border-radius:2px;position:relative;margin-top:6px;}
.wsfill{height:100%;border-radius:2px;}
.wstarget{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-2);opacity:.55;}
.wsnums{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;}
.wsnums b{color:var(--ink);font-weight:500;}

.queue{display:grid;gap:1px;background:var(--line-soft);border-top:1px solid var(--line-soft);margin-top:14px;}
.qrow{background:var(--surface);padding:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;}
.qrow .t{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qgrouphead{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:12px 0 4px;}

.deadlines li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px;}
.deadlines{list-style:none;margin:10px 0 0;padding:0;}
.deadlines .when{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;}
.deadlines .when.due{color:var(--alert);}

.prio-list{list-style:none;margin:12px 0 0;padding:0;counter-reset:p;}
.prio-list li{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;align-items:flex-start;}
.prio-list li:before{counter-increment:p;content:counter(p);font-family:var(--mono);font-size:10px;color:var(--faint);padding-top:3px;}

/* ---------- week board ---------- */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start;}
.daycol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:150px;display:flex;flex-direction:column;}
.daycol.dragover{border-color:var(--accent);background:var(--accent-soft);}
.dayhead{padding:12px 13px 10px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.dayhead .d{font-size:13px;font-weight:600;letter-spacing:-.01em;}
.dayhead .dt{font-family:var(--mono);font-size:10px;color:var(--faint);display:block;font-weight:400;margin-top:2px;letter-spacing:.06em;}
.dayhead .h{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;}
.daybody{padding:9px;display:flex;flex-direction:column;gap:8px;flex:1;}
.dayfoot{padding:0 9px 10px;}

.task{
  border:1px solid var(--line);border-left:3px solid var(--ws);border-radius:2px;
  padding:9px 10px;background:var(--surface);cursor:grab;transition:box-shadow .12s,border-color .12s;
}
.task:hover{box-shadow:0 1px 6px rgba(16,20,22,.07);}
.task.done{opacity:.5;}
.task .tn{font-size:12.5px;line-height:1.35;font-weight:500;letter-spacing:-.005em;}
.task .tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px;}
.task .ws{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ws);}
.task .hrs{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:auto;}
.task .rec{font-family:var(--mono);font-size:9px;color:var(--faint);}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 7px;border-radius:10px;
  border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;background:var(--surface);
}
.pill .pd{width:5px;height:5px;border-radius:50%;flex:none;}
.pill.plain{border-color:transparent;background:var(--surface-2);color:var(--muted);}
.prio{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;}
.prio.High{color:var(--alert);}
.prio.Medium{color:var(--warn);}
.prio.Low{color:var(--faint);}

.addtask{
  width:100%;text-align:left;padding:8px 10px;border:1px dashed var(--line);border-radius:2px;
  color:var(--faint);font-size:12px;
}
.addtask:hover{border-color:var(--accent);color:var(--accent);}

.weekfoot{margin-top:14px;display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:center;}

/* ---------- kanban ---------- */
.kanban{display:flex;gap:11px;overflow-x:auto;padding-bottom:10px;align-items:start;}
.kcol{flex:0 0 232px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
.kcol.dragover{border-color:var(--accent);background:var(--accent-soft);}
.khead{padding:11px 12px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;}
.khead .kn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);}
.khead .kc{font-family:var(--mono);font-size:10px;color:var(--faint);}
.kbody{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px;}
.kcard{border:1px solid var(--line);border-radius:2px;padding:9px 10px;cursor:grab;background:var(--surface);}
.kcard:hover{box-shadow:0 1px 6px rgba(16,20,22,.07);}
.kcard .kt{font-size:12.5px;font-weight:500;line-height:1.35;}
.kcard .kmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center;}

/* ---------- funnel ---------- */
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start;}
.fcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
.fcol.dragover{border-color:var(--accent);background:var(--accent-soft);}
.fhead{padding:12px;border-bottom:1px solid var(--line-soft);}
.fstage{font-size:12.5px;font-weight:600;letter-spacing:-.01em;}
.fnum{font-family:var(--mono);font-size:9.5px;color:var(--faint);letter-spacing:.1em;}
.fmix{display:flex;gap:2px;margin-top:9px;height:3px;}
.fmix i{display:block;height:100%;border-radius:1px;}
.fgap{margin-top:8px;font-size:10.5px;color:var(--warn);line-height:1.35;}
.fgap.ok{color:var(--faint);}
.fbody{padding:9px;display:flex;flex-direction:column;gap:7px;}
.fitem{border:1px solid var(--line);border-radius:2px;padding:8px 9px;cursor:grab;font-size:12px;line-height:1.35;}
.fitem .fk{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;display:block;}
.fk.Existing{color:var(--ok);}
.fk.Creating{color:var(--info);}
.fk.Idea{color:var(--faint);}
.fk.Gap{color:var(--alert);}

/* ---------- tables / lists ---------- */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}
table{border-collapse:collapse;width:100%;min-width:900px;}
th{
  text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid var(--line-soft);font-size:12.5px;vertical-align:top;}
tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--surface-2);}
td .sub{color:var(--muted);font-size:11.5px;display:block;margin-top:2px;}

.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.ideacard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:10px;}
.ideacard .it{font-size:13.5px;font-weight:500;line-height:1.35;letter-spacing:-.005em;cursor:pointer;}
.ideacard .meta{display:flex;flex-wrap:wrap;gap:6px;}
.ideacard .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px;border-top:1px solid var(--line-soft);}

.scriptcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;}
.scriptcard .hook{
  font-family:var(--serif);font-size:16px;line-height:1.4;font-weight:400;margin:10px 0 0;
  padding-left:12px;border-left:2px solid var(--accent);color:var(--ink-2);
}

/* ---------- review ---------- */
.rev{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
.revlist{list-style:none;margin:10px 0 0;padding:0;}
.revlist li{padding:8px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;justify-content:space-between;font-size:12.5px;}
.revlist li:last-child{border-bottom:none;}
textarea.field,input.field,select.field{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:8px 10px;font-size:13px;line-height:1.45;
}
textarea.field{resize:vertical;min-height:78px;}
input.field:focus,textarea.field:focus,select.field:focus{border-color:var(--accent);outline:none;}
.hcheck{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
.hcheck .b{border:1px solid var(--line-soft);border-radius:2px;padding:10px 12px;}
.hcheck .b .v{font-family:var(--serif);font-size:22px;}

.archrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;}
.archhead{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;width:100%;text-align:left;}
.archhead .w{font-family:var(--serif);font-size:17px;}
.archstats{display:flex;gap:18px;flex-wrap:wrap;}
.archstats span{font-family:var(--mono);font-size:11px;color:var(--muted);}
.archbody{padding:0 18px 18px;border-top:1px solid var(--line-soft);}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,20,22,.28);z-index:60;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:430px;max-width:100%;background:var(--surface);
  border-left:1px solid var(--line);z-index:61;display:flex;flex-direction:column;
  box-shadow:-8px 0 32px rgba(16,20,22,.10);
}
.dhead{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.dhead h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:4px 0 0;}
.dbody{padding:18px 22px 30px;overflow-y:auto;flex:1;}
.dfoot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.f.wide{grid-column:1 / -1;}
.f label{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);}


.modalwrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:460px;max-width:100%;
  box-shadow:0 12px 48px rgba(16,20,22,.18);position:relative;z-index:81;}
.modal .mhead{padding:20px 22px 0;}
.modal h3{font-family:var(--serif);font-weight:400;font-size:20px;margin:6px 0 0;letter-spacing:-.01em;}
.modal .mbody{padding:12px 22px 4px;font-size:13px;color:var(--ink-2);line-height:1.5;white-space:pre-line;}
.modal .mfoot{padding:16px 22px 18px;display:flex;justify-content:flex-end;gap:8px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:3px;font-size:12.5px;box-shadow:0 6px 24px rgba(16,20,22,.24);max-width:90vw;}
.notice{background:var(--accent-soft);border:1px solid #cfe0de;border-radius:var(--r);padding:14px 16px;
  margin-bottom:14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.notice p{margin:0;font-size:12.5px;color:var(--accent);max-width:70ch;}

.presence{display:flex;align-items:center;gap:4px;}
.who{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);
  font-size:10px;background:var(--line);color:var(--ink-2);border:1px solid var(--surface);}
.who.me{background:var(--accent);color:#fff;}
.wholabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-left:5px;}
.gate{max-width:520px;margin:70px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:34px 34px 30px;}
.gate.wide{max-width:720px;}
.gate .steps{margin:0 0 18px;padding-left:20px;color:var(--ink-2);font-size:13px;line-height:1.7;}
.gate .steps li{margin-bottom:3px;}
textarea.field.sql{font-family:var(--mono);font-size:11px;line-height:1.55;min-height:250px;
  background:var(--surface-2);white-space:pre;overflow-x:auto;}
.gate h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:6px 0 0;letter-spacing:-.015em;}
.gate p{color:var(--muted);font-size:13px;margin:10px 0 22px;line-height:1.55;}
.gate .f{margin-bottom:14px;}
.gate-note{background:var(--surface-2);border-radius:2px;padding:11px 13px;font-size:11.5px;
  color:var(--muted);line-height:1.5;margin-top:16px;}
.gate-note.err{background:#fbecea;color:var(--alert);}
.empty{padding:26px 20px;text-align:center;color:var(--faint);font-size:12.5px;}
.hint{font-size:11.5px;color:var(--muted);}
.rowbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}

@media (max-width:1180px){
  .dash{grid-template-columns:1fr;}

function mondayOf(date){ const d=new Date(date); const wd=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-wd); return iso(d); }
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function weekLabel(start){

/* ============================================================
   State and sync — public link, no login

   How access works
   ----------------
   There is no sign-in. Whoever opens the link can use the planner.

   The link can carry a secret phrase in its fragment, like:
       https://you.github.io/planner/#k=our-shared-phrase

   That phrase is sent as a header on every database call, and the security
   policy requires it. The phrase lives in the link, never in this file, so
   publishing this code in a public repo does not expose the data. It is
   remembered in the browser after the first visit, so the plain URL works
   from then on.

   Open the page with no #k= at all and the planner runs fully open: anyone
   with the address can read and write. Choose deliberately — the setup
   screen generates whichever policy matches how you opened it.

   Live updates
   ------------
   Changes are broadcast to everyone connected, and a slow poll runs as a
   safety net in case a broadcast is missed. Each object is its own row, so
   two people editing different things never overwrite each other.
   ============================================================ */

/* ---- configuration ---------------------------------------------------- */
const SUPABASE_URL = "https://sclipfqhvsbhkqbqrtzw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Kq8yacps2xIkyz8YadyheA_aicI940u";

/* Leave this empty. The phrase comes from the link, which is the whole point —
   anything written here would be published along with the code. */
const PLANNER_SECRET_FALLBACK = "";

const TABLE = "planner_items";
const CFG_KEY = "baliston-planner-config";
const WEEK_KEY = "baliston-planner-week";
const SECRET_KEY = "baliston-planner-secret";
const NAME_KEY = "baliston-planner-name";
const POLL_MS = 30000;

let state = seed();
let sb = null;
let channel = null;
let saveTimer = null;
let pollTimer = null;
let peers = [];
let netError = "";
let tableMissing = false;
let MODE = "local";
const lastSynced = new Map();
const clientId = Math.random().toString(36).slice(2,10);

/* ---- the shared phrase ------------------------------------------------- */
function readSecretFromUrl(){
  const h = location.hash || "";
  const m = h.match(/[#&]k=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
function secret(){
  const fromUrl = readSecretFromUrl();
  if(fromUrl){
    try{ localStorage.setItem(SECRET_KEY, fromUrl); }catch(e){}
    return fromUrl;
  }
  try{ return localStorage.getItem(SECRET_KEY) || PLANNER_SECRET_FALLBACK; }catch(e){ return PLANNER_SECRET_FALLBACK; }
}
function shareLink(){
  const base = location.origin + location.pathname;
  const s = secret();
  return s ? base + "#k=" + encodeURIComponent(s) : base;
}
function myName(){
  try{ return localStorage.getItem(NAME_KEY) || ""; }catch(e){ return ""; }
}
function setMyName(n){ try{ localStorage.setItem(NAME_KEY, n); }catch(e){} }

function cfg(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY) return {url:SUPABASE_URL, key:SUPABASE_ANON_KEY};
  try{
    const raw = localStorage.getItem(CFG_KEY);
    if(raw){ const c = JSON.parse(raw); if(c.url && c.key) return c; }
  }catch(e){}
  return null;
}
function setCfg(url,key){ try{ localStorage.setItem(CFG_KEY, JSON.stringify({url:url.trim(), key:key.trim()})); }catch(e){} }
function clearCfg(){ try{ localStorage.removeItem(CFG_KEY); }catch(e){} }

function chip(text, on){
  const c = document.getElementById("saveChip");
  if(c){ c.textContent = text; c.classList.toggle("on", !!on); }
}
function liveChip(){
  chip(peers.length ? "Live · "+(peers.length+1)+" here" : "Live · synced", true);
}
function valid(p){ return p && typeof p === "object" && p.weeks && Object.keys(p.weeks).length; }

/* ---- week objects expose a live tasks view ----------------------------- */
function hydrateWeek(w){
  if(!w) return w;
  const d = Object.getOwnPropertyDescriptor(w,"tasks");
  if(!d || !d.get){
    const stored = Array.isArray(w.tasks) ? w.tasks : null;
    delete w.tasks;
    Object.defineProperty(w, "tasks", {
      get(){ return state.tasks.filter(t=>t.weekId===w.start); },
      enumerable:false, configurable:true
    });
    if(stored) stored.forEach(t=>{ t.weekId = w.start; state.tasks.push(t); });
  }
  return w;
}
function hydrate(st){
  st.tasks = st.tasks || [];
  Object.keys(st.weeks||{}).forEach(k=>{
    const w = st.weeks[k]; w.start = w.start || k; w.id = w.start; hydrateWeek(w);
  });
  ["pipeline","funnel","ideas","kols","scripts"].forEach(k=>{ st[k] = st[k]||[]; });
  return st;
}

/* ---- rows -------------------------------------------------------------- */
const COLS = {content:"pipeline", idea:"ideas", funnel:"funnel", kol:"kols", script:"scripts"};
function colByKind(kind){ return kind==="task" ? state.tasks : (state[COLS[kind]] || []); }

function collectRows(){
  const rows = [];
  Object.keys(state.weeks).forEach(k=>{
    const w = state.weeks[k];
    rows.push({id:"week:"+w.start, kind:"week", week_id:w.start,
      data:{start:w.start, capacity:w.capacity, archived:!!w.archived,
            priorities:w.priorities||[], review:w.review||{}}});
  });
  state.tasks.forEach(t=>{
    const {id, weekId, ...rest} = t;
    rows.push({id:"task:"+id, kind:"task", week_id:weekId, data:{...rest, _id:id}});
  });
  Object.keys(COLS).forEach(kind=>{
    (state[COLS[kind]]||[]).forEach(o=>{
      const {id, ...rest} = o;
      rows.push({id:kind+":"+id, kind, week_id:null, data:{...rest, _id:id}});
    });
  });
  return rows;
}

function applyRow(r){
  lastSynced.set(r.id, JSON.stringify(r.data));
  const d = r.data || {};
  if(r.kind==="week"){
    const ex = state.weeks[d.start];
    if(ex){ ex.capacity=d.capacity; ex.archived=d.archived; ex.priorities=d.priorities||[]; ex.review=d.review||{}; }
    else state.weeks[d.start] = hydrateWeek({id:d.start, start:d.start, capacity:d.capacity,
      archived:d.archived, priorities:d.priorities||[], review:d.review||{}});
    return;
  }
  const col = colByKind(r.kind);
  const obj = {...d, id:d._id}; delete obj._id;
  if(r.kind==="task") obj.weekId = r.week_id;
  const ix = col.findIndex(x=>x.id===obj.id);
  if(ix>-1) col[ix] = obj; else col.push(obj);
}

function dropRow(id){
  lastSynced.delete(id);
  const kind = id.slice(0, id.indexOf(":"));
  const rest = id.slice(id.indexOf(":")+1);
  if(kind==="week"){ delete state.weeks[rest]; return; }
  const col = colByKind(kind);
  const ix = col.findIndex(x=>x.id===rest);
  if(ix>-1) col.splice(ix,1);
}

/* ---- saving ------------------------------------------------------------ */
function save(){
  clearTimeout(saveTimer);
  chip("Saving…");
  saveTimer = setTimeout(flush, 500);
}

async function flush(){
  if(MODE!=="cloud"){
    try{ localStorage.setItem(KEY, JSON.stringify(serialise())); chip("Saved in this browser", true); }
    catch(e){ chip("Save failed — export a backup"); }
    return;
  }
  const rows = collectRows();
  const seen = new Set(rows.map(r=>r.id));
  const ups = rows.filter(r=>lastSynced.get(r.id) !== JSON.stringify(r.data));
  const dels = [...lastSynced.keys()].filter(id=>!seen.has(id));
  if(!ups.length && !dels.length){ liveChip(); return; }
  try{
    if(ups.length){
      const payload = ups.map(r=>({id:r.id, kind:r.kind, week_id:r.week_id, data:r.data,
        updated_by: myName()||"someone", updated_at:new Date().toISOString()}));
      const {error} = await sb.from(TABLE).upsert(payload, {onConflict:"id"});
      if(error) throw error;
      ups.forEach(r=>lastSynced.set(r.id, JSON.stringify(r.data)));
    }
    if(dels.length){
      const {error} = await sb.from(TABLE).delete().in("id", dels);
      if(error) throw error;
      dels.forEach(id=>lastSynced.delete(id));
    }
    if(channel){
      channel.send({type:"broadcast", event:"change", payload:{
        from:clientId,
        rows: ups.map(r=>({id:r.id, kind:r.kind, week_id:r.week_id, data:r.data})),
        deleted: dels
      }});
    }
    netError = ""; liveChip();
  }catch(e){
    netError = e.message || "sync failed";
    chip("Offline — changes held here");
    try{ localStorage.setItem(KEY+"-pending", JSON.stringify(serialise())); }catch(_){}
  }
}

function serialise(){
  return {version:2, currentWeek:state.currentWeek, weeks:Object.fromEntries(
      Object.entries(state.weeks).map(([k,w])=>[k,{start:w.start,capacity:w.capacity,
        archived:w.archived,priorities:w.priorities,review:w.review}])),
    tasks:state.tasks, pipeline:state.pipeline, funnel:state.funnel,
    ideas:state.ideas, kols:state.kols, scripts:state.scripts, tab:state.tab};
}

/* ---- loading ----------------------------------------------------------- */
async function loadCloud(){
  const {data, error} = await sb.from(TABLE).select("*");
  if(error) throw error;
  if(!data.length) return false;
  state.weeks = {}; state.tasks = [];
  state.pipeline=[]; state.funnel=[]; state.ideas=[]; state.kols=[]; state.scripts=[];
  lastSynced.clear();
  data.filter(r=>r.kind==="week").forEach(applyRow);
  data.filter(r=>r.kind!=="week").forEach(applyRow);
  const keys = Object.keys(state.weeks).sort();
  let want = null;
  try{ want = localStorage.getItem(WEEK_KEY); }catch(e){}
  state.currentWeek = (want && state.weeks[want]) ? want
    : (keys.filter(k=>!state.weeks[k].archived)[0] || keys[keys.length-1]);
  return true;
}

async function seedCloud(){
  hydrate(state);
  const rows = collectRows().map(r=>({id:r.id, kind:r.kind, week_id:r.week_id, data:r.data, updated_by:"setup"}));
  const {error} = await sb.from(TABLE).upsert(rows, {onConflict:"id"});
  if(error) throw error;
  rows.forEach(r=>lastSynced.set(r.id, JSON.stringify(r.data)));
}

/* Safety net: broadcasts can be missed, so re-read periodically. Only
   redraws when something actually differs from what we already hold. */
async function poll(){
  if(MODE!=="cloud" || document.hidden) return;
  try{
    const {data, error} = await sb.from(TABLE).select("*");
    if(error || !data) return;
    let changed = false;
    const ids = new Set();
    data.forEach(r=>{
      ids.add(r.id);
      if(lastSynced.get(r.id) !== JSON.stringify(r.data)){ applyRow(r); changed = true; }
    });
    [...lastSynced.keys()].forEach(id=>{ if(!ids.has(id)){ dropRow(id); changed = true; } });
    if(changed) softRender();
  }catch(e){}
}

/* ---- realtime ---------------------------------------------------------- */
let rerenderTimer = null;
function softRender(){
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(()=>{ renderMain(); if(drawer) renderDrawer(); }, 120);
}

function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel("planner", {config:{presence:{key: clientId}, broadcast:{self:false}}});

  channel.on("broadcast", {event:"change"}, ({payload})=>{
    if(!payload || payload.from===clientId) return;
    (payload.rows||[]).forEach(applyRow);
    (payload.deleted||[]).forEach(dropRow);
    softRender();
  });

  channel.on("presence", {event:"sync"}, ()=>{
    const st = channel.presenceState();
    peers = Object.keys(st).filter(k=>k!==clientId)

/* ---- setup SQL --------------------------------------------------------- */
function setupSql(){
  const s = secret();
  const guard = s
    ? `  using      (current_setting('request.headers', true)::json ->> 'x-planner-key' = '${s.replace(/'/g,"''")}')\n  with check (current_setting('request.headers', true)::json ->> 'x-planner-key' = '${s.replace(/'/g,"''")}')`
    : `  using (true)\n  with check (true)`;
  return `-- Baliston planner setup. Paste into the Supabase SQL Editor and press Run.
${s ? "-- Access requires the phrase carried in your planner link." : "-- WARNING: no phrase set, so anyone with the address has full access."}

create table if not exists ${TABLE} (
  id          text primary key,
  kind        text not null,
  week_id     text,
  data        jsonb not null,
  updated_at  timestamptz not null default now(),
  updated_by  text
);

create index if not exists ${TABLE}_kind_idx on ${TABLE} (kind);
create index if not exists ${TABLE}_week_idx on ${TABLE} (week_id);

alter table ${TABLE} enable row level security;

drop policy if exists "planner link access" on ${TABLE};
create policy "planner link access"
  on ${TABLE} for all
  to anon
${guard};`;
}

async function checkTable(){
  const {error} = await sb.from(TABLE).select("id").limit(1);
  if(!error) return "ok";
  const m = ((error.message||"")+" "+(error.code||"")).toLowerCase();
  if(error.code==="42P01" || m.includes("does not exist") || m.includes("could not find the table")) return "missing";
  if(error.code==="42501" || m.includes("permission") || m.includes("row-level security") || m.includes("violates")) return "denied";
  return "error:"+(error.message||"unknown");
}

/* ---- boot -------------------------------------------------------------- */
async function initSupabase(){
  const c = cfg();
  if(!c) return false;
  let createClient;
  for(const url of ["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm",
                    "https://esm.sh/@supabase/supabase-js@2"]){
    try{ ({createClient} = await import(url)); if(createClient) break; }catch(e){}
  }
  if(!createClient){ netError = "Could not load the Supabase library from a CDN."; return false; }
  const s = secret();
  sb = createClient(c.url, c.key, {
    auth:{persistSession:false, autoRefreshToken:false},
    global: s ? {headers:{"x-planner-key": s}} : {}
  });
  return true;
}

async function boot(){
  hydrate(state);
  try{ const w = localStorage.getItem(WEEK_KEY); if(w) state.currentWeek = w; }catch(e){}

  // tidy the phrase out of the address bar once it's remembered
  if(readSecretFromUrl() && history.replaceState){
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  }

  const configured = await initSupabase();
  if(!configured && !cfg()){ renderCfgGate(); return; }

  if(configured){
    MODE = "cloud";
    try{
      const st = await checkTable();
      if(st==="missing" || st==="denied"){ tableMissing = true; renderSqlGate(st); return; }
      if(st.indexOf("error:")===0) throw new Error(st.slice(6));
      tableMissing = false;
      const had = await loadCloud();
      if(!had){ hydrate(state); await seedCloud(); }
      subscribe();
      clearInterval(pollTimer); pollTimer = setInterval(poll, POLL_MS);
      liveChip();
      render(); renderPresence();
      if(!myName()) askName();
      return;
    }catch(e){
      netError = e.message || String(e);
      MODE = "local";
      chip("Cloud unavailable — using this browser");
      toast("Could not reach the database: "+netError);
    }
  }

  MODE = "local";
  let loaded = false;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(valid(p)){ state = hydrate(p); loaded = true; } }
  }catch(e){}
  if(!loaded){
    try{
      const res = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
      if(res.ok){ const p = await res.json(); if(valid(p)){ state = hydrate(p); save(); } }
    }catch(e){}
  }
  chip("Saved in this browser", true);
  render();
}

async function pullRepo(){
  let repo = null;
  try{
    const res = await fetch("data.json?t="+Date.now(), {cache:"no-store"});
    if(res.ok){ const p = await res.json(); if(valid(p)) repo = p; }
  }catch(e){}
  if(!repo){ toast("No data.json found next to this page."); return; }
  ask({
    eyebrow:"Repo version", title:"Replace everything with the committed version?",
    body:"In cloud mode this overwrites the shared database for everyone.",
    confirmLabel:"Load the repo version",
    onYes:()=>{
      state = hydrate(repo);
      if(!state.weeks[state.currentWeek]) state.currentWeek = weekKeys().slice(-1)[0];
      save(); render(); toast("Loaded from the repo.");
    }
  });
}

   ============================================================ */
function statusPill(n){
  return `<span class="pill"><i class="pd" style="background:${stColor(n)}"></i>${esc(n)}</span>`;
}
function opts(list, val){
  return list.map(o=>`<option value="${esc(o)}"${o===val?" selected":""}>${esc(o)}</option>`).join("");
}

function meter(used, cap){
  const denom = Math.max(cap, used, 1);
  const w = week();
  const segs = WS.map(ws=>{
    const h = (w.tasks||[]).filter(t=>t.workstream===ws.id).reduce((s,t)=>s+(Number(t.hours)||0),0);
    return h>0 ? `<i class="meter-seg" style="width:${(h/denom)*100}%;background:${ws.c}" title="${esc(ws.name)} — ${num(h)}h"></i>` : "";
  }).join("");
  const over = used>cap
    ? `<i class="meter-over" style="left:${(cap/denom)*100}%;width:${((used-cap)/denom)*100}%"></i>` : "";
  let ticks="";
  for(let i=1;i<Math.ceil(denom);i++){
    ticks += `<i class="meter-tick ${i%5===0?"major":""} ${i>used?"empty":""}" style="left:${(i/denom)*100}%"></i>`;
  }
  const capLine = `<i class="meter-cap" style="left:${(cap/denom)*100}%"></i>`;
  const diff = used - cap;
  let flag;
  if(diff > 0.001) flag = `<span class="flag over">${num(diff)}h over capacity</span>`;
  else if(diff < -2) flag = `<span class="flag under">${num(-diff)}h unassigned</span>`;
  else flag = `<span class="flag good">On capacity</span>`;

  return `
  <div class="meter-read">
    <span class="big num">${num(used)}</span>
    <span class="of">of ${num(cap)} hours planned</span>
    ${flag}
  </div>
  <div class="meter">
    <div class="meter-track">
      <div class="meter-segs">${segs}${over}</div>
      <div class="meter-ticks">${over}${ticks}${capLine}</div>
    </div>
    <div class="meter-scale"><span>0h</span><span>${num(Math.max(cap,used))}h</span></div>
  </div>`;
}

      </div>

  }).join("");

  const qGroups = REVIEW_STATES.map(s=>{
    const rows = t.filter(x=>x.status===s);

  return `

      <p>Where the 15 hours are going this week, and what is sitting with you.</p>

    <button class="btn" data-act="go" data-tab="week">Open the week →</button>
  </div>

  <div class="dash">
    <div class="card pad">
      <span class="eyebrow">Capacity</span>
      ${meter(used, w.capacity)}
      <div class="statgrid">
        <div class="stat"><div class="v num">${num(used)}</div><div class="l">Hours allocated</div></div>
        <div class="stat"><div class="v num">${num(Math.max(0,w.capacity-used))}</div><div class="l">Hours remaining</div></div>
        <div class="stat"><div class="v num">${done}</div><div class="l">Tasks completed</div></div>
        <div class="stat"><div class="v num">${wip}</div><div class="l">Tasks in progress</div></div>
      </div>
      <div style="margin-top:26px"><span class="eyebrow">Hours by workstream · marker shows the target</span></div>
      <div class="wsbar" style="margin-top:14px">${wsRows}</div>
    </div>

    <div style="display:grid;gap:14px">
      <div class="card pad">
        <span class="eyebrow">Needs you</span>
        ${qGroups ? `<div class="queue">${qGroups}</div>` : `<div class="empty">Nothing is waiting on you. Clear.</div>`}
      </div>
      <div class="card pad">
        <span class="eyebrow">Upcoming deadlines</span>

/* ============================================================
   In-page dialogs

   Artifacts run in a sandboxed frame where window.confirm,
   window.alert and window.prompt are blocked — they return
   nothing and the calling code silently stops. Everything that
   needs a yes/no or a text entry goes through here instead.
   ============================================================ */
let modal = null;
let toastTimer = null;

function ask(o){ modal = o; renderModal(); }

function toast(msg){
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ host.innerHTML=""; }, 3200);
}

function renderModal(){
  const host = document.getElementById("modalHost");
  if(!modal){ host.innerHTML=""; return; }
  const m = modal;
  host.innerHTML = `
    <div class="scrim" data-act="closeModal"></div>
    <div class="modalwrap">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.title)}">
        <div class="mhead"><span class="eyebrow">${esc(m.eyebrow||"Confirm")}</span><h3>${esc(m.title)}</h3></div>
        <div class="mbody">${esc(m.body||"")}</div>
        ${m.input!==undefined ? `<div style="padding:12px 22px 0"><textarea class="field" id="modalInput" style="min-height:120px">${esc(m.input)}</textarea></div>` : ""}
        <div class="mfoot">
          <button class="btn" data-act="closeModal">${esc(m.cancelLabel||"Cancel")}</button>
          <button class="btn primary" data-act="confirmModal">${esc(m.confirmLabel||"Confirm")}</button>
        </div>
      </div>
    </div>`;
  const f = host.querySelector("#modalInput") || host.querySelector('[data-act="confirmModal"]');
  if(f) f.focus();
}

function closeModal(){ modal=null; renderModal(); }

function confirmModal(){
  if(!modal) return;
  const fn = modal.onYes;
  const inp = document.getElementById("modalInput");
  const val = inp ? inp.value : undefined;
  modal = null; renderModal();
  if(fn) fn(val);
}

let drawer = null; // {type, id}

function collectionOf(type){
  if(type==="task") return state.tasks;
  if(type==="content") return state.pipeline;
  if(type==="idea") return state.ideas;
  if(type==="funnel") return state.funnel;
  if(type==="kol") return state.kols;
  if(type==="script") return state.scripts;
  return [];
}
const findItem = (type,id) => collectionOf(type).find(x=>x.id===id);

function renderDrawer(){
  const host = document.getElementById("drawerHost");
  if(!drawer){ host.innerHTML=""; return; }
  const sc = SCHEMA[drawer.type];
  const it = findItem(drawer.type, drawer.id);
  if(!it){ drawer=null; host.innerHTML=""; return; }

  const fields = sc.fields.map(f=>{
    const v = it[f.k] ?? "";
    let input;
    if(f.t==="select"){
      const labels = f.labels || f.o;
      input = `<select class="field" data-fk="${f.k}">${f.o.map((o,i)=>`<option value="${esc(o)}"${o===v?" selected":""}>${esc(labels[i])}</option>`).join("")}</select>`;
    } else if(f.t==="textarea"){
      input = `<textarea class="field" data-fk="${f.k}"${f.tall?' style="min-height:170px"':""}>${esc(v)}</textarea>`;
    } else if(f.t==="number"){
      input = `<input class="field num" type="number" min="0" step="0.25" data-fk="${f.k}" value="${esc(v)}">`;
    } else if(f.t==="date"){
      input = `<input class="field" type="date" data-fk="${f.k}" value="${esc(v)}">`;
    } else if(f.t==="list"){
      input = `<input class="field" list="dl-${f.k}" data-fk="${f.k}" value="${esc(v)}"><datalist id="dl-${f.k}">${f.o.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`;
    } else {
      input = `<input class="field" type="text" data-fk="${f.k}" value="${esc(v)}">`;
    }
    return `<div class="f ${f.wide?"wide":""}"><label>${esc(f.l)}</label>${input}</div>`;
  }).join("");

  host.innerHTML = `
    <div class="scrim" data-act="closeDrawer"></div>
    <aside class="drawer" role="dialog" aria-label="Edit ${esc(sc.title)}">
      <div class="dhead">
        <div><span class="eyebrow">Edit</span><h3>${esc(sc.title)}</h3></div>
        <button class="btn ghost" data-act="closeDrawer" aria-label="Close">Close</button>
      </div>
      <div class="dbody"><div class="fgrid">${fields}</div></div>
      <div class="dfoot">
        <button class="btn danger" data-act="deleteItem">Delete</button>
        <button class="btn primary" data-act="closeDrawer">Done</button>
      </div>
    </aside>`;

  host.querySelectorAll("[data-fk]").forEach(el=>{
    el.addEventListener("input", e=>{
      const k = e.target.dataset.fk;
      const f = sc.fields.find(x=>x.k===k);
      it[k] = f.t==="number" ? (Number(e.target.value)||0) : e.target.value;
      save(); renderMain();
    });
  });
  const first = host.querySelector(".field"); if(first) first.focus();
}

  const c = {id:uid(),title:"New content piece",pillar:"",funnel:"Education",format:"Static Post",
    platform:"Instagram",owner:"Narindra",stage:stage||"Idea",deadline:"",publishDate:"",cta:"",asset:"",caption:"Not started",notes:""};
  state.pipeline.push(c); save(); render(); openDrawer("content",c.id);
}
function newIdea(){
  const i = {id:uid(),idea:"New idea",pillar:"",audience:"",funnel:"Awareness",format:"Reel / Short Video",
    platform:"Instagram",priority:"Medium",notes:"",ref:""};
  state.ideas.unshift(i); save(); render(); openDrawer("idea",i.id);
}
function newFunnel(stage){
  const f = {id:uid(),stage:stage||"Awareness",kind:"Idea",title:"New item",format:"Other",platform:"Instagram",notes:""};
  state.funnel.push(f); save(); render(); openDrawer("funnel",f.id);
}
function loadKolList(){
  const have = new Set(state.kols.map(k=>(k.name||"").trim().toLowerCase()));
  const add = KOL_LIST.filter(k=>!have.has(k.name.trim().toLowerCase()));
  if(!add.length){ toast("Every name on the outreach list is already in the tracker."); return; }
  ask({
    eyebrow:"Outreach list",
    title:"Add "+add.length+" candidate"+(add.length===1?"":"s")+"?",
    body:"These come from the KOL & Social Outreach Target List v0.2, with the France entries left out. Nothing already in your tracker is changed or removed.",
    confirmLabel:"Add "+add.length,
    onYes:()=>{
      add.forEach(k=>state.kols.push(Object.assign({id:uid()},k)));
      save(); render();
      toast(add.length+" candidates added.");
    }
  });
}
function newKol(){
  const k = {id:uid(),name:"New candidate",specialty:"",org:"",country:"",instagram:"",linkedin:"",other:"",
    audience:"",why:"",collab:"",priority:"Medium",contact:"",status:"Researching",notes:""};
  state.kols.unshift(k); save(); render(); openDrawer("kol",k.id);
}
function newScript(){
  const s = {id:uid(),title:"New script",topic:"",audience:"Patients",funnel:"Education",videoType:"Educational Reel",
    length:"45s",hook:"",body:"",cta:"",status:"Idea",filmed:"No",published:"No",link:""};
  state.scripts.unshift(s); save(); render(); openDrawer("script",s.id);
}

function ideaToWeek(id){
  const i = state.ideas.find(x=>x.id===id); if(!i) return;
  const t = {id:uid(),day:"mon",workstream:"content",name:i.idea,hours:1,actual:0,status:"Not Started",
    priority:i.priority,due:"",format:i.format,platform:i.platform,owner:"Narindra",
    recurrence:"One-off",link:i.ref||"",notes:i.notes||""};
  t.weekId = state.currentWeek; state.tasks.push(t);
  state.ideas = state.ideas.filter(x=>x.id!==id);
  state.tab="week"; save(); render(); openDrawer("task",t.id);
}
function ideaToPipe(id){
  const i = state.ideas.find(x=>x.id===id); if(!i) return;
  const c = {id:uid(),title:i.idea,pillar:i.pillar,funnel:i.funnel,format:i.format,platform:i.platform,
    owner:"Narindra",stage:"Briefed",deadline:"",publishDate:"",cta:"",asset:"",caption:"Not started",notes:i.notes||""};
  state.pipeline.push(c);
  state.funnel.push({id:uid(),stage:i.funnel,kind:"Creating",title:i.idea,format:i.format,platform:i.platform,notes:""});
  state.ideas = state.ideas.filter(x=>x.id!==id);
  state.tab="pipeline"; save(); render(); openDrawer("content",c.id);
}

function archiveWeek(){
  const w = week();
  ask({
    eyebrow:"Close the week",
    title:"Archive "+weekLabel(w.start)+"?",
    body:"Unfinished tasks move to the new week. Recurring tasks start again at Not Started. The archived week stays readable in the Archive.",
    confirmLabel:"Archive and start the next week",
    onYes:()=>doArchive(w)
  });
}

function doArchive(w){
  w.archived = true;
  const nextStart = addDays(w.start,7);
  const carried = [];
  (w.tasks||[]).forEach(t=>{
    if(t.status!=="Completed"){
      carried.push({...t, id:uid(), actual:0, weekId:nextStart});
    } else if(t.recurrence==="Recurring"){
      carried.push({...t, id:uid(), actual:0, status:"Not Started", due:"", weekId:nextStart});
    }
  });
  carried.forEach(t=>state.tasks.push(t));
  const nextPr = ((w.review||{}).nextPriorities||[]).filter(Boolean);
  state.weeks[nextStart] = hydrateWeek({
    id:nextStart, start:nextStart, capacity:w.capacity, archived:false,
    priorities: nextPr.length?nextPr:[],
    review:{keyProgress:"",nextPriorities:["","",""]}
  });
  setCurrentWeek(nextStart);
  state.tab = "week";
  save(); render();
}

function copyReport(k){
  const w = state.weeks[k]; if(!w) return;
  const done = (w.tasks||[]).filter(t=>t.status==="Completed");
  const byWs = WS.map(ws=>{
    const h = (w.tasks||[]).filter(t=>t.workstream===ws.id).reduce((s,t)=>s+(Number(t.actual||t.hours)||0),0);
    return h ? `  ${ws.name}: ${num(h)}h` : "";
  }).filter(Boolean).join("\n");
  const txt = [
    `Baliston Health — content week ${weekLabel(w.start)}`,
    `Hours: ${num(actualH(w))} of ${num(w.capacity)} available`,
    ``,
    `Hours by workstream:`, byWs, ``,
    `Completed (${done.length}):`,
    ...done.map(t=>`  • ${t.name} — ${num(t.actual||t.hours)}h`),
    ``,
    `Key progress: ${(w.review||{}).keyProgress||"—"}`
  ].join("\n");
  const fallback = () => ask({
    eyebrow:"Weekly report", title:"Copy this report",
    body:"Select the text below and copy it.", input:txt,
    confirmLabel:"Done", cancelLabel:"Close", onYes:()=>{}
  });
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("Report copied."), fallback);
  } else { fallback(); }
}

function exportData(){
  const blob = new Blob([JSON.stringify(serialise(),null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "data.json";
  a.click();
}

function importData(){
  const inp = document.getElementById("importFile");
  if(!inp) return;
  inp.value = "";
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      let p;
      try{ p = JSON.parse(r.result); }
      catch(err){ toast("That file isn't a valid planner backup."); return; }
      if(!p || !p.weeks){ toast("That file isn't a planner backup — no weeks found in it."); return; }
      ask({
        eyebrow:"Import", title:"Replace everything with this backup?",
        body:"This cannot be undone. Export the current version first if you might need it.",
        confirmLabel:"Replace everything",
        onYes:()=>{
          state = hydrate(p); state.tab = "week";
          if(!state.weeks[state.currentWeek]) state.currentWeek = weekKeys().slice(-1)[0];
          save(); render(); toast("Backup imported.");
        }
      });
    };
    r.readAsText(f);
  };
  inp.click();
}

function editPriorities(){
  const w = week();
  const cur = (w.priorities||[]).join("\n");
  ask({
    eyebrow:"This week", title:"Priorities",
    body:"One per line. The first five are kept.",
    input:cur, confirmLabel:"Save priorities",
    onYes:(v)=>{
      w.priorities = String(v||"").split("\n").map(x=>x.trim()).filter(Boolean).slice(0,5);
      save(); render();
    }
  });
}

/* ============================================================
   Render + events
   ============================================================ */
function renderTabs(){
  document.getElementById("tabs").innerHTML = TABS.map(t=>{
    const c = tabCount(t.k);
    return `<button class="tab" role="tab" aria-selected="${state.tab===t.k}" data-act="go" data-tab="${t.k}">${t.n}${c!==""?`<span class="cnt num">${c}</span>`:""}</button>`;
  }).join("");

  const keys = weekKeys().reverse();
  document.getElementById("weekPick").innerHTML = keys.map(k=>
    `<option value="${k}"${k===state.currentWeek?" selected":""}>${weekLabel(k)}${state.weeks[k].archived?" · archived":""}</option>`
  ).join("");
}

function renderMain(){
  const v = document.getElementById("view");
  const y = window.scrollY;
  v.innerHTML =
    state.tab==="dash" ? viewDash() :
    state.tab==="week" ? viewWeek() :
    state.tab==="pipeline" ? viewPipeline() :
    state.tab==="funnel" ? viewFunnel() :
    state.tab==="ideas" ? viewIdeas() :
    state.tab==="kols" ? viewKols() :
    state.tab==="scripts" ? viewScripts() : viewReview();
  window.scrollTo(0,y);
  renderTabs();
}
function render(){ renderMain(); renderDrawer(); }

/* ---- clicks ---- */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id;
  switch(a){
    case "go": state.tab = el.dataset.tab; save(); render(); break;
    case "newTask": newTask(el.dataset.day); break;
    case "newContent": newContent(el.dataset.stage); break;
    case "newIdea": newIdea(); break;
    case "newFunnel": newFunnel(el.dataset.stage); break;
    case "newKol": newKol(); break;
    case "loadKolList": loadKolList(); break;
    case "newScript": newScript(); break;
    case "openTask": openDrawer("task",id); break;
    case "openContent": openDrawer("content",id); break;
    case "openIdea": openDrawer("idea",id); break;
    case "openFunnel": openDrawer("funnel",id); break;
    case "openKol": openDrawer("kol",id); break;
    case "openScript": openDrawer("script",id); break;
    case "closeDrawer": closeDrawer(); break;
    case "closeModal": closeModal(); break;
    case "confirmModal": confirmModal(); break;
    case "deleteItem": {
      if(!drawer) break;
      const d = {type:drawer.type, id:drawer.id};
      ask({
        eyebrow:"Delete", title:"Delete this permanently?",
        body:"It won't be recoverable.", confirmLabel:"Delete",
        onYes:()=>{
          const col = (d.type==="task") ? state.tasks
            : d.type==="content" ? state.pipeline
            : d.type==="idea" ? state.ideas
            : d.type==="funnel" ? state.funnel
            : d.type==="kol" ? state.kols : state.scripts;
          const ix = col.findIndex(x=>x.id===d.id);
          if(ix>-1) col.splice(ix,1);
          closeDrawer(); save(); render(); toast("Deleted.");
        }
      });
      break;
    }
    case "ideaToWeek": ideaToWeek(id); break;
    case "ideaToPipe": ideaToPipe(id); break;
    case "archive": archiveWeek(); break;
    case "editPriorities": editPriorities(); break;
    case "exportData": exportData(); break;
    case "importData": importData(); break;
    case "pullRepo": pullRepo(); break;
    case "saveCfg": {
      const u = document.getElementById("cfgUrl").value.trim();
      const k = document.getElementById("cfgKey").value.trim();
      if(!u || !k){ toast("Both the project URL and the key are needed."); break; }
      if(/service_role|sb_secret/.test(k)){ toast("That's the secret key — use the publishable one."); break; }
      setCfg(u,k); netError=""; boot(); break;
    }
    case "useLocal": { clearCfg(); MODE="local"; boot(); break; }
    case "copySql": {
      const box = document.getElementById("sqlBox");
      const txt = box ? box.value : setupSql();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(
          ()=>toast("SQL copied. Paste it into the Supabase SQL Editor."),
          ()=>{ box.select(); toast("Press Ctrl+C or Cmd+C to copy."); });
      } else if(box){ box.select(); toast("Press Ctrl+C or Cmd+C to copy."); }
      break;
    }
    case "recheck": { toast("Checking…"); boot(); break; }
    case "copyLink": {
      const l = shareLink();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(l).then(()=>toast("Link copied — send it to whoever needs access."),
          ()=>ask({eyebrow:"Share", title:"Copy this link", body:"", input:l, confirmLabel:"Done", onYes:()=>{}}));
      } else {
        ask({eyebrow:"Share", title:"Copy this link", body:"", input:l, confirmLabel:"Done", onYes:()=>{}});
      }
      break;
    }
    case "setName": { askName(); break; }
    case "account": {
      const s = secret();
      ask({
        eyebrow: MODE==="cloud" ? "Shared planner" : "This browser only",
        title: MODE==="cloud" ? (s ? "Live · protected by link" : "Live · open link") : "Not connected",
        body: MODE==="cloud"
          ? (s
              ? "Anyone with the full link can open and edit this planner. No sign-in needed. Copy the link below to share it — and treat it like a password, because that is what it is."
              : "This planner is completely open: anyone with the web address can read and edit everything. To lock it down, reopen it with #k=your-phrase on the end of the address and re-run the setup SQL.")
          : "No database connected, so this planner saves to this browser and nobody else sees it.",
        confirmLabel: MODE==="cloud" ? "Copy the share link" : "Close",
        cancelLabel: "Change my name",
        onYes: ()=>{ if(MODE==="cloud") document.querySelector('[data-act="copyLink"]')?.click(); }
      });
      break;
    }
  }
});

/* ---- inputs outside the drawer ---- */
document.addEventListener("input", e=>{
  const el = e.target.closest("[data-act]");
  if(!el) return;
  if(el.dataset.act==="setCap"){ week().capacity = Number(el.value)||0; save(); renderMain(); }
  if(el.dataset.act==="rev"){ week().review[el.dataset.k] = el.value; save(); }
  if(el.dataset.act==="revprio"){
    const rv = week().review; rv.nextPriorities = rv.nextPriorities||[];
    rv.nextPriorities[Number(el.dataset.i)] = el.value; save();
  }
});

function setCurrentWeek(k){
  state.currentWeek = k;
  try{ localStorage.setItem(WEEK_KEY, k); }catch(e){}
}
document.getElementById("weekPick").addEventListener("change", e=>{
  setCurrentWeek(e.target.value); render();
});

/* ---- keyboard ---- */
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && modal) { closeModal(); return; }
  if(e.key==="Escape" && drawer) closeDrawer();
  if(e.key==="Enter" || e.key===" "){
    const el = document.activeElement;
    if(el && el.matches('.task,.kcard,.fitem')){ e.preventDefault(); el.click(); }
  }
});

/* ---- drag and drop ---- */
let dragging = null;
document.addEventListener("dragstart", e=>{
  const el = e.target.closest("[data-drag]");
  if(!el) return;
  dragging = {type:el.dataset.drag, id:el.dataset.id};
  e.dataTransfer.effectAllowed = "move";
  try{ e.dataTransfer.setData("text/plain", el.dataset.id); }catch(_){}
});
document.addEventListener("dragover", e=>{
  const z = e.target.closest("[data-drop]");
  if(!z || !dragging) return;
  const ok = (z.dataset.drop==="day" && dragging.type==="task")
          || (z.dataset.drop==="pipe" && dragging.type==="content")
          || (z.dataset.drop==="funnel" && dragging.type==="funnel");
  if(!ok) return;
  e.preventDefault();
  document.querySelectorAll(".dragover").forEach(n=>n.classList.remove("dragover"));
  z.classList.add("dragover");
});
document.addEventListener("dragleave", e=>{
  const z = e.target.closest("[data-drop]");
  if(z) z.classList.remove("dragover");
});
document.addEventListener("drop", e=>{
  const z = e.target.closest("[data-drop]");
  document.querySelectorAll(".dragover").forEach(n=>n.classList.remove("dragover"));
  if(!z || !dragging) return;
  e.preventDefault();
  if(z.dataset.drop==="day" && dragging.type==="task"){
    const t = state.tasks.find(x=>x.id===dragging.id); if(t) t.day = z.dataset.day;
  }
  if(z.dataset.drop==="pipe" && dragging.type==="content"){
    const c = state.pipeline.find(x=>x.id===dragging.id);
    if(c){ c.stage = z.dataset.stage; if(c.stage==="Published" && !c.publishDate) c.publishDate = TODAY; }
  }
  if(z.dataset.drop==="funnel" && dragging.type==="funnel"){
    const f = state.funnel.find(x=>x.id===dragging.id); if(f) f.stage = z.dataset.stage;
  }
  dragging = null; save(); renderMain();
});
document.addEventListener("dragend", ()=>{ dragging=null; document.querySelectorAll(".dragover").forEach(n=>n.classList.remove("dragover")); });

boot();
</script>
